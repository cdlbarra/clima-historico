name: Recolector diario

on:
  schedule:
    - cron: "0 11 * * *"    # todos los días a las 11:00 UTC
  workflow_dispatch:         # permite ejecutarlo a mano desde GitHub

permissions:
  contents: write            # necesario para guardar weather.db en el repo

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: python recolector.py
      - run: python observador.py

      - name: Guardar cambios en weather.db
        if: always()  # siempre se ejecuta, aunque fallen los pasos anteriores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.db
          git diff --staged --quiet || git commit -m "Datos del $(date -u +%F)"
          git push